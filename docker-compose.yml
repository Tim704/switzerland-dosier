# switzerland-dosier — cloudflared routes alpine.timhufnagel.org → 127.0.0.1:3005.
services:
  alpine:
    build: .
    image: switzerland-dosier:latest
    container_name: switzerland-dosier
    restart: unless-stopped
    ports:
      - "127.0.0.1:3005:3005"
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3005/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
