server {
    listen 3005;
    root /usr/share/nginx/html;
    index index.html;
    # History-mode SPA fallback (mirrors vercel.json rewrites).
    location / { try_files $uri $uri/ /index.html; }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
